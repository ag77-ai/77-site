<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0d10">
<title>77 — Dashboard</title>
<style>
:root{--bg:#0b0d10;--c:#14171c;--l:#262b34;--ink:#eaecef;--i2:#98a0ac;--i3:#69717d;--pm:#c9973f;--g:#4ea87a;--r:#c05a51;--acc:#c8a45c;--m:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,system-ui,sans-serif}
.w{max-width:1100px;margin:0 auto;padding:16px}
header{position:sticky;top:0;z-index:10;background:var(--bg);padding:10px 0;margin-top:-16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;margin-bottom:14px}
h1{font:700 20px var(--m);margin:0;letter-spacing:.02em}h1 span{color:var(--acc)}
a.back,button{font:600 11px var(--m);letter-spacing:.08em;text-transform:uppercase;color:var(--i2);background:var(--c);border:1px solid var(--l);border-radius:99px;padding:8px 12px;text-decoration:none;cursor:pointer}
button:hover,a.back:hover{color:var(--ink);border-color:var(--i3)}
.meta{font:11px var(--m);color:var(--i3)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:14px;margin-bottom:12px}
.grid .card{margin-bottom:0}
.card h2{font:700 11px var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin:0 0 10px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{padding:6px 10px}.tabs button.on{color:var(--bg);background:var(--acc);border-color:var(--acc)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.cols{grid-template-columns:1fr}}
.cols h3{font:700 10.5px var(--m);letter-spacing:.1em;text-transform:uppercase;margin:0 0 6px}
.up h3{color:var(--g)}.dn h3{color:var(--r)}
ol{margin:0;padding-left:20px}li{margin:3px 0}li.n{list-style:none;color:var(--i3)}
.up li::marker{color:var(--g)}.dn li::marker{color:var(--r)}
table{width:100%;border-collapse:collapse;font:12px var(--m)}
th,td{text-align:right;padding:5px 4px;border-bottom:1px solid var(--l)}
th:first-child,td:first-child{text-align:left;color:var(--i2)}th{color:var(--i3);font-weight:600}
td.now{color:var(--ink);font-weight:700}
.chip{display:inline-block;font:700 10px var(--m);padding:3px 8px;border-radius:99px;border:1px solid}
.chip.g{color:var(--g);border-color:rgba(78,168,122,.5)}.chip.r{color:var(--r);border-color:rgba(192,90,81,.5)}.chip.n{color:var(--i2);border-color:var(--l)}
.sub{font:11px var(--m);color:var(--i3);margin:-4px 0 8px}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:560px){.kv{grid-template-columns:repeat(2,1fr)}}
.kv div{border:1px solid var(--l);border-radius:8px;padding:8px}
.kv b{display:block;font:700 17px var(--m)}.kv small{font:10.5px var(--m);color:var(--i3)}.kv i{font:600 10.5px var(--m);font-style:normal}
svg{width:100%;height:auto;display:block}
svg text{font:10px var(--m);fill:var(--i3)}
.lg{display:flex;gap:12px;flex-wrap:wrap;font:10.5px var(--m);color:var(--i2);margin-top:4px}
.lg s{display:inline-block;width:10px;height:3px;margin-right:5px;vertical-align:middle;text-decoration:none}
#tok{display:none}
#tok input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--l);background:var(--bg);color:var(--ink);font:12px var(--m);margin:8px 0}
.err{color:var(--r);font:12px var(--m)}

.act{display:grid;grid-template-columns:22px 62px 1fr;gap:8px;align-items:start;padding:9px 0;border-bottom:1px solid var(--l)}
.act:last-child{border-bottom:0}
.act .no{font:700 12px var(--m);color:var(--i3);padding-top:2px}
.act .hd{font:700 12px var(--m);color:var(--ink)}
.act .tx{color:var(--i2);font-size:13px;margin-top:1px}
.act .ac{color:var(--acc);font-size:13px;margin-top:3px;font-weight:600}
.v{display:inline-block;font:700 10px var(--m);letter-spacing:.06em;padding:3px 0;border-radius:99px;border:1px solid;width:58px;text-align:center}
.v.g{color:var(--g);border-color:rgba(78,168,122,.6);background:rgba(78,168,122,.1)}
.v.a{color:#d9a441;border-color:rgba(217,164,65,.6);background:rgba(217,164,65,.1)}
.v.r{color:var(--r);border-color:rgba(192,90,81,.6);background:rgba(192,90,81,.1)}
.ins{font:600 13px/1.4 -apple-system,system-ui,sans-serif;color:var(--ink);border-left:3px solid var(--acc);padding:2px 0 2px 10px;margin:0 0 10px}
.tw{overflow-x:auto}
.tw table td,.tw table th{white-space:nowrap}
td.g{color:var(--g)}td.a{color:#d9a441}td.r{color:var(--r)}
.span2{grid-column:1/-1}
.kv i{color:var(--i3)}
.cnt{font:11px var(--m);color:var(--i3);margin-left:8px;letter-spacing:0;text-transform:none}
@media(max-width:560px){.act{grid-template-columns:20px 58px 1fr;gap:6px}}
</style></head><body><div class="w">
<header><h1>77 <span>Dashboard</span></h1>
<div><span class="meta" id="gen">loading…</span> <button id="rf">Refresh</button> <button id="cp" style="color:var(--acc);border-color:var(--acc)">Copy for Claude</button> <a class="back" href="./" style="color:var(--acc);border-color:var(--acc)">← Back to exercises</a></div></header>
<div class="card" id="tok"><h2>Connect this device</h2>
<div>Paste your GitHub token once (same one the tracker uses). It stays in this browser only.</div>
<input id="tokin" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…">
<button id="toksave">Save &amp; load</button></div>
<div id="err" class="err"></div>
<div class="card" id="cpbox" style="display:none"><h2>Copy for Claude</h2><div class="meta">Clipboard blocked. Click inside, press Cmd+A then Cmd+C.</div><textarea id="cpta" readonly style="width:100%;height:340px;margin-top:8px;background:var(--bg);color:var(--ink);border:1px solid var(--l);border-radius:8px;padding:10px;font:12px var(--m)"></textarea></div>
<div id="app"></div>
</div>
<script>
var GK='77gh',T='';try{T=localStorage.getItem(GK)||''}catch(e){}
var $=function(i){return document.getElementById(i)};
function gh(p){return fetch('https://api.github.com/repos/ag77-ai/77-state/contents/dash/'+p,{headers:{Authorization:'Bearer '+T,Accept:'application/vnd.github.raw'},cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(p+' → HTTP '+r.status);return r.text()})}
function pf(p){if(p==null)return'—';var m=Math.floor(p),s=Math.round((p-m)*60);if(s==60){m++;s=0}return m+':'+(s<10?'0':'')+s}
function fx(v,d){return v==null?'—':(+v).toFixed(d==null?1:d)}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
var WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dayDate(n){var d=new Date(Date.UTC(2026,8,11+n));return WD[d.getUTCDay()]+' '+('0'+d.getUTCDate()).slice(-2)+' '+MO[d.getUTCMonth()]}
function dayLab(n){return'Day '+n+' · '+dayDate(n)}
function istDay(){var s=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata'}).format(new Date());return Math.round((Date.parse(s+'T00:00:00Z')-Date.UTC(2026,8,11))/864e5)}
var VC={g:'GREEN',a:'AMBER',r:'RED'};

/* ---------- chart engine (inline SVG) ---------- */
function plot(o){
 var W=640,H=o.H||230,L=46,R=14,Tp=12,Bt=26,x0=o.x0,x1=o.x1,y0=o.y0,y1=o.y1;
 var X=function(v){return L+(v-x0)/(x1-x0)*(W-L-R)},Y=function(v){v=Math.max(y0,Math.min(y1,v));var f=(v-y0)/(y1-y0);if(o.inv)f=1-f;return Tp+(1-f)*(H-Tp-Bt)};
 var g='',i;
 for(i=0;i<=4;i++){var v=y0+(y1-y0)*i/4,yy=Y(v);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy.toFixed(1)+'" y2="'+yy.toFixed(1)+'" stroke="#262b34"/><text x="'+(L-6)+'" y="'+(yy+3).toFixed(1)+'" text-anchor="end">'+o.fy(v)+'</text>'}
 (o.xt||[]).forEach(function(t){g+='<text x="'+X(t[0]).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+t[1]+'</text>'});
 (o.bands||[]).forEach(function(b){var ya=Y(b.a),yb=Y(b.b);g+='<rect x="'+L+'" y="'+Math.min(ya,yb).toFixed(1)+'" width="'+(W-L-R)+'" height="'+Math.abs(yb-ya).toFixed(1)+'" fill="'+b.c+'" opacity=".16"/><text x="'+(L+6)+'" y="'+(Math.min(ya,yb)+11).toFixed(1)+'" style="fill:'+b.c+'">'+b.t+'</text>'});
 (o.hl||[]).forEach(function(h){var yy=Y(h.y);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy.toFixed(1)+'" y2="'+yy.toFixed(1)+'" stroke="'+h.c+'" stroke-width="1.3" stroke-dasharray="'+(h.d||'5 4')+'"/><text x="'+(W-R-2)+'" y="'+(yy-4).toFixed(1)+'" text-anchor="end" style="fill:'+h.c+'">'+h.t+'</text>'});
 (o.vl||[]).forEach(function(h){var xx=X(h.x);g+='<line x1="'+xx.toFixed(1)+'" x2="'+xx.toFixed(1)+'" y1="'+Tp+'" y2="'+(H-Bt)+'" stroke="#69717d" stroke-dasharray="2 3"/><text x="'+xx.toFixed(1)+'" y="'+(Tp+9)+'" text-anchor="middle">'+h.t+'</text>'});
 (o.lines||[]).forEach(function(l){if(l.pts.length>1)g+='<polyline fill="none" stroke="'+l.c+'" stroke-width="'+(l.w||2)+'" stroke-linejoin="round" stroke-linecap="round"'+(l.d?' stroke-dasharray="'+l.d+'"':'')+(l.o?' opacity="'+l.o+'"':'')+' points="'+l.pts.map(function(p){return X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)}).join(' ')+'"/>'});
 (o.dots||[]).forEach(function(s){s.pts.forEach(function(p){g+='<circle cx="'+X(p[0]).toFixed(1)+'" cy="'+Y(p[1]).toFixed(1)+'" r="'+(s.r||3)+'" fill="'+(p[2]||s.c)+'" opacity="'+(s.o==null?1:s.o)+'"><title>'+esc(p[3]||o.fy(p[1]))+'</title></circle>'})});
 var lg=(o.lg||[]).map(function(s){return'<span><s style="background:'+s[0]+(s[2]?';height:8px;width:8px;border-radius:50%':'')+'"></s>'+s[1]+'</span>'}).join('');
 return'<svg viewBox="0 0 '+W+' '+H+'">'+g+'</svg>'+(lg?'<div class="lg">'+lg+'</div>':'');
}
function lineAt(f,a,b){return[[a,f[0]+f[1]*a],[b,f[0]+f[1]*b]]}
function monthTicks(x0,x1){var r=[],d=new Date(x0);d=new Date(d.getFullYear(),d.getMonth()+(d.getDate()>1?1:0),1);while(d.getTime()<=x1){r.push([d.getTime(),MO[d.getMonth()]+' '+String(d.getFullYear()).slice(2)]);d=new Date(d.getFullYear(),d.getMonth()+2,1)}return r}
function ms(s){return Date.parse(s.replace(' ','T'))}
function pad(a,lo,hi,mn){var l=Math.min.apply(0,a),h=Math.max.apply(0,a);if(lo!=null)l=Math.min(l,lo);if(hi!=null)h=Math.max(h,hi);var p=Math.max((h-l)*.1,mn||.1);return[l-p,h+p]}

function chartBF(d){
 var b=d.bf,xn=d.day,f=b.fit,pts=b.pts.map(function(p){return[p[0],p[1],null,'Day '+p[0].toFixed(1)+' · '+p[1]+'%']});
 var yr=pad(pts.map(function(p){return p[1]}).concat([10]),null,null,.4);
 return plot({x0:0,x1:100,y0:yr[0],y1:yr[1],fy:function(v){return v.toFixed(1)+'%'},xt:[0,20,40,60,80,100].map(function(v){return[v,'D'+v]}),
  hl:[{y:12,c:'#69717d',t:'12%',d:'2 3'}],vl:[{x:xn,t:'today'}],
  lines:[{pts:b.target,c:'#c8a45c',w:1.8,d:'6 4'},{pts:f?lineAt(f,0,xn):[],c:'#4ea87a',w:3.2},{pts:f?lineAt(f,xn,100):[],c:'#4ea87a',w:2,d:'3 4',o:.7}],
  dots:[{pts:pts,c:'#4ea87a',r:2.6,o:.4}],
  lg:[['#4ea87a','Trend (linear fit since Day 0)'],['#c8a45c','Target line to 10% by Day 100'],['#4ea87a','Daily readings',1]]});
}
function chartLean(d){
 var b=d.lean,xn=d.day,f=b.fit,pts=b.pts.map(function(p){return[p[0],p[1],null,'Day '+p[0].toFixed(1)+' · '+p[1]+' kg']});
 var yr=pad(pts.map(function(p){return p[1]}),b.floor,b.base,.15),x1=Math.max(xn+7,21);
 var xt=[];for(var v=0;v<=x1;v+=7)xt.push([v,'D'+v]);
 return plot({x0:0,x1:x1,y0:yr[0],y1:yr[1],fy:function(v){return v.toFixed(1)},xt:xt,
  hl:[{y:b.floor,c:'#c05a51',t:b.floor+' floor'},{y:b.base,c:'#c8a45c',t:b.base+' Day 0',d:'2 3'}],vl:[{x:xn,t:'today'}],
  lines:[{pts:f?lineAt(f,0,xn):[],c:'#4ea87a',w:3.2}],dots:[{pts:pts,c:'#4ea87a',r:2.6,o:.4}],
  lg:[['#4ea87a','Trend'],['#4ea87a','Lean readings (kg)',1]]});
}
function pacePlot(pts,extraLo,d,cap){
 var all=pts.map(function(p){return p[1]}),first=Math.min.apply(0,pts.map(function(p){return p[0]}));
 var x0=Math.max(Date.parse('2025-05-01T00:00:00'),first-3*864e5),x1=Date.parse(d.asof+'T00:00:00')+4*864e5;
 var lo=Math.min(Math.min.apply(0,all),extraLo)-.2,hi=Math.min(Math.max.apply(0,all)+.3,cap);
 return{x0:x0,x1:x1,y0:Math.max(lo,3),y1:hi,xt:monthTicks(x0,x1)};
}
function chartRun(d){
 var r=d.run,cut=Date.parse('2026-09-12T00:00:00'),pts=r.pts.map(function(p){var t=ms(p[0]);return[t,p[1],t>=cut?'#c8a45c':null,p[0].slice(0,16)+' · '+pf(p[1])+'/km · '+p[2]+' km']});
 if(!pts.length)return'<div class="meta">no runs ≥ 3 km</div>';
 var ax=pacePlot(pts,r.target,d,12);
 return plot({x0:ax.x0,x1:ax.x1,y0:ax.y0,y1:ax.y1,inv:1,fy:pf,xt:ax.xt,hl:[{y:r.target,c:'#c8a45c',t:pf(r.target)+' target'}],
  lines:[{pts:r.roll.map(function(p){return[ms(p[0]),p[1]]}),c:'#eaecef',w:2.6}],dots:[{pts:pts,c:'#98a0ac',r:3,o:.55}],
  lg:[['#eaecef','30-day average'],['#98a0ac','Run ≥ 3 km',1],['#c8a45c','Since 12 Sep',1]]});
}
function chartWalk(d){
 var w=d.walk,E='#c8a45c',Lt='#7aa7d9',pts=w.pts.map(function(p){return[ms(p[0]),p[1],p[3]?E:Lt,p[0].slice(0,16)+' · '+pf(p[1])+'/km · '+p[2]+' km']});
 if(!pts.length)return'<div class="meta">no walks ≥ 4.5 km</div>';
 var ax=pacePlot(pts,w.band?w.band[0]:99,d,12.5);
 return plot({x0:ax.x0,x1:ax.x1,y0:ax.y0,y1:ax.y1,inv:1,fy:pf,xt:ax.xt,bands:w.band?[{a:w.band[0],b:w.band[1],c:'#4ea87a',t:'normal band (30 d, 25th–75th pctile)'}]:[],
  lines:[{pts:w.roll.map(function(p){return[ms(p[0]),p[1]]}),c:'#eaecef',w:2.6}],dots:[{pts:pts,c:Lt,r:3.4,o:.9}],
  lg:[['#eaecef','30-day average'],[E,'Started before '+w.cutoff,1],[Lt,'Started '+w.cutoff+' or later',1]]});
}
function chartPM(d){
 var rows=d.pm.rows,W=640,H=230,L=46,R=14,Tp=22,Bt=28,mx=0,g='';
 rows.forEach(function(r){mx=Math.max(mx,r.last||0,r.this||0)});mx=Math.ceil(mx*1.15);
 var Y=function(v){return Tp+(1-v/mx)*(H-Tp-Bt)},gw=(W-L-R)/rows.length,bw=Math.min(46,gw/3);
 for(var i=0;i<=4;i++){var v=mx*i/4;g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="#262b34"/><text x="'+(L-6)+'" y="'+(Y(v)+3).toFixed(1)+'" text-anchor="end">'+v.toFixed(0)+'</text>'}
 rows.forEach(function(r,k){var cx=L+gw*k+gw/2;
  [[r.last,'#69717d',-bw-2,'last wk'],[r.this,'#c8a45c',2,'this wk']].forEach(function(b){if(b[0]==null)return;g+='<rect x="'+(cx+b[2]).toFixed(1)+'" y="'+Y(b[0]).toFixed(1)+'" width="'+bw+'" height="'+(H-Bt-Y(b[0])).toFixed(1)+'" fill="'+b[1]+'" rx="2"><title>'+r.wd+' '+b[3]+' · '+b[0]+' kcal/min</title></rect><text x="'+(cx+b[2]+bw/2).toFixed(1)+'" y="'+(Y(b[0])-4).toFixed(1)+'" text-anchor="middle" style="fill:var(--ink)">'+b[0].toFixed(1)+'</text>'});
  g+='<text x="'+cx.toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle" style="fill:var(--i2)">'+r.wd+'</text>';
  if(r.pct!=null)g+='<text x="'+cx.toFixed(1)+'" y="12" text-anchor="middle" style="fill:'+(r.pct>=0?'var(--g)':'var(--r)')+'">'+(r.pct>=0?'▲ ':'▼ ')+Math.abs(r.pct)+'%</text>';
  else if(!r.this)g+='<text x="'+(cx+bw/2+2).toFixed(1)+'" y="'+(H-Bt-6)+'" text-anchor="middle">not yet</text>'});
 return'<svg viewBox="0 0 '+W+' '+H+'">'+g+'</svg><div class="lg"><span><s style="background:#69717d"></s>Last week</span><span><s style="background:#c8a45c"></s>This week</span><span>kcal per minute, strength workouts</span></div>';
}

/* ---------- cards ---------- */
function ud(list){
 var u=[],d=[];(list||[]).forEach(function(x){if(x[0]=='up')u.push(x[1]);else if(x[0]=='down')d.push(x[1])});
 var f=function(a,e){return a.length?a.map(function(t){return'<li>'+esc(t)+'</li>'}).join(''):'<li class="n">'+e+'</li>'};
 return'<div class="cols"><div class="up"><h3>Improved ('+u.length+')</h3><ol>'+f(u,'nothing yet')+'</ol></div><div class="dn"><h3>Not improved ('+d.length+')</h3><ol>'+f(d,'nothing slipped')+'</ol></div></div>';
}
function runway(plan){
 var n=istDay();
 if(!plan||plan.last_day==null)return{k:'plan',v:'a',head:'Plan runway',text:'Could not read plan.json from the site.',act:'Redeploy the tracker with deploy.sh.'};
 var gap=plan.last_day-n,left=Math.max(gap,0),v=gap<=2?'r':gap<=5?'a':'g';
 return{k:'plan',v:v,head:'Plan runway',text:'Tracker plan ends '+dayLab(plan.last_day)+'; today is '+dayLab(n)+': '+left+' day'+(left==1?'':'s')+' left.',act:v=='g'?'Nothing to do yet.':'Ask Opus for the next plan block now, then deploy it.'};
}
function actionsCard(A){
 var c={g:0,a:0,r:0};A.forEach(function(a){c[a.v]++});
 return'<div class="card"><h2>Actions<span class="cnt">'+c.g+' green · '+c.a+' amber · '+c.r+' red</span></h2>'+A.map(function(a,i){
  return'<div class="act"><div class="no">'+(i+1)+'.</div><div><span class="v '+a.v+'">'+VC[a.v]+'</span></div><div><div class="hd">'+esc(a.head)+'</div><div class="tx">'+esc(a.text)+'</div><div class="ac">→ '+esc(a.act)+'</div></div></div>'}).join('')+'</div>';
}
function bfTable(t){
 var cl=function(r){return r.delta==null?'r':r.delta>=-2?'g':r.delta>=-10?'a':'r'};
 return'<div class="card"><h2>Body fat by date · target vs your trend</h2><div class="tw"><table><tr><th>Target day</th><th>Target BF</th><th>Target lean</th><th>Projected day (trend)</th><th>Ahead / behind</th></tr>'+t.map(function(r){
  return'<tr><td>'+dayLab(r.day)+'</td><td>'+r.bf+'%</td><td>'+r.lean.toFixed(2)+' kg</td><td>'+(r.proj_day==null?'—':dayLab(r.proj_day))+'</td><td class="'+cl(r)+'">'+esc(r.status)+'</td></tr>'}).join('')+'</table></div></div>';
}
function chartCard(title,ins,svg,cls){return'<div class="card '+(cls||'')+'"><h2>'+title+'</h2><div class="ins">'+esc(ins)+'</div>'+svg+'</div>'}
function loadsCard(L){
 if(!L||!L.exercises)return'';
 return'<div class="card"><h2>Load progression<span class="cnt">updated '+esc(L.updated||'')+'</span></h2><div class="tw"><table><tr><th>Exercise</th><th>Current</th><th>Since</th><th>Previous</th><th>Next upgrade gate</th></tr>'+L.exercises.map(function(e){
  return'<tr><td title="'+esc(e.session||'')+'">'+esc(e.name)+'</td><td class="now">'+esc(e.current)+'</td><td>'+dayLab(e.since_day)+'</td><td>'+esc(e.previous||'—')+'</td><td>'+esc(e.gate||'—')+'</td></tr>'}).join('')+'</table></div></div>';
}
function wcard(name,w){
 if(!w||!w.latest)return'<div class="card"><h2>'+name+'</h2><div class="meta">no data</div></div>';
 var l=w.latest,p=w.pace,vs=p.now<p.last10;
 var row=function(lab,m,f,hasBest){return'<tr><td>'+lab+'</td><td class="now">'+f(m.now)+'</td><td>'+f(m.last10)+'</td><td>'+f(m.median)+'</td>'+(hasBest?'<td>'+f(m.best)+'</td><td>'+f(m.best_since)+'</td>':'<td>—</td><td>—</td>')+'</tr>'};
 return'<div class="card"><h2>Latest '+name+' vs history</h2><div class="sub">'+l.start.slice(0,16)+' · '+fx(l.km,2)+' km · '+fx(l.min,0)+' min · '+fx(l.kcal,0)+' kcal · n='+w.n_hist+' since 1 May 2025</div>'
 +'<div class="tw"><table><tr><th></th><th>Now</th><th>Last 10</th><th>Median</th><th>Best</th><th>Best since 11 Sep</th></tr>'
 +row('Pace /km',w.pace,pf,1)+row('kcal/min',w.kcal_min,function(x){return fx(x,1)},1)+row('Avg HR',w.avg_hr,function(x){return fx(x,0)},0)+'</table></div>'
 +'<div style="margin-top:8px"><span class="chip '+(vs?'g':'r')+'">Pace '+(vs?'faster':'slower')+' than last-10 avg by '+pf(Math.abs(p.last10-p.now))+'/km</span> <span class="chip '+(p.now<=p.best?'g':'n')+'">'+(p.now<=p.best?'NEW BEST':'best '+pf(p.best)+', gap '+pf(p.now-p.best))+'</span></div></div>';
}
function actCard(a){
 var k=function(l,key,d,sc){var c=a.last7[key],p=a.prev7[key],x=p?(c-p)/p*100:null;return'<div><small>'+l+'</small><b>'+(sc?(c/1000).toFixed(1)+'k':fx(c,d))+'</b><i>'+(x==null?'':'prev 7: '+(x>=0?'+':'−')+Math.abs(x).toFixed(0)+'%')+'</i></div>'};
 return'<div class="card"><h2>Activity · last 7 days (context only)</h2><div class="kv">'+k('Steps','steps',0,1)+k('Distance km','km',1)+k('Active kcal','active_kcal',0)+k('Exercise min','exercise_min',0)+'</div></div>';
}

var LAST=null;
function render(S,Ld,plan){
 var D=S.dash;
 if(!D){$('app').innerHTML='<div class="card"><h2>Old data</h2><div class="meta">summary.json has no dashboard block. Double-click 77-Sync.command.</div></div>';return}
 var A=D.actions.concat([runway(plan)]);LAST=[S,A,Ld];
 $('gen').textContent=D.day_label+' · synced '+S.generated.replace('T',' ').slice(0,16);
 var tabs=[['dod','Day-on-day'],['wow','Week-on-week'],['vs_base','Since 15 Sep']],cur='dod';
 var h=actionsCard(A);
 h+='<div class="card"><h2>Body · improved / not improved</h2><div class="tabs" id="tabs"></div><div id="ud"></div></div>';
 h+=bfTable(D.bf_table);
 h+='<div class="grid">'
  +chartCard('Body fat %',D.bf.insight,chartBF(D))
  +chartCard('Lean mass (kg)',D.lean.insight,chartLean(D))
  +chartCard('Run pace /km · runs ≥ 3 km · faster = higher',D.run.insight,chartRun(D))
  +chartCard('Walk pace /km · training walks ≥ 4.5 km · faster = higher',D.walk.insight,chartWalk(D))
  +chartCard('PM session kcal/min · this week vs last',D.pm.insight,chartPM(D),'span2')+'</div><div style="height:12px"></div>';
 h+=loadsCard(Ld);
 h+='<div class="grid">'+wcard('run',S.workouts.run)+wcard('walk',S.workouts.walk)+'</div><div style="height:12px"></div>'+actCard(S.activity);
 $('app').innerHTML=h;
 var show=function(){$('ud').innerHTML=ud(S.body[cur]);$('tabs').innerHTML=tabs.map(function(t){return'<button data-k="'+t[0]+'" class="'+(t[0]==cur?'on':'')+'">'+t[1]+'</button>'}).join('');
  Array.prototype.forEach.call($('tabs').children,function(b){b.onclick=function(){cur=b.dataset.k;show()}})};show();
}

/* ---------- Copy for Claude (built in browser, zero Claude usage) ---------- */
function ln(a){return a.length?a.map(function(t,i){return'   '+'abcdefghij'[i]+'. '+t[1]}).join('\n'):'   a. none'}
function buildText(S,A,Ld){
 var b=S.body,l=b.last,pr=b.prev,wk=b.week_ref,bs=b.base,a=S.activity,L=[],D=S.dash;
 var bl=function(r){return r.weight+' kg · fat '+r.fat_pct+'% ('+r.fat_kg+' kg) · lean '+r.lean_kg+' · muscle '+r.muscle_kg+' · water '+r.water_kg+' · visceral '+r.visceral};
 L.push('77 STATUS · '+D.day_label+' of 100 (synced '+S.generated.replace('T',' ').slice(0,16)+')','');
 L.push('ACTIONS');
 A.forEach(function(x,i){L.push((i+1)+'. ['+VC[x.v]+'] '+x.head+': '+x.text,'   → '+x.act)});
 L.push('');
 L.push('1. BODY NOW (Cult scale '+l.ts.slice(11,16)+')','   a. '+bl(l),'   b. prev '+pr.date+': '+bl(pr),'   c. week ago '+wk.date+': '+wk.weight+' kg · fat '+wk.fat_pct+'%','   d. since 15 Sep: '+bs.weight+' kg · fat '+bs.fat_pct+'%','');
 var u=function(x){return(x||[]).filter(function(y){return y[0]=='up'})},d=function(x){return(x||[]).filter(function(y){return y[0]=='down'})};
 L.push('2. IMPROVED / NOT (day-on-day)','   IMPROVED:',ln(u(b.dod)),'   NOT IMPROVED:',ln(d(b.dod)),'');
 L.push('3. IMPROVED / NOT (week-on-week)','   IMPROVED:',ln(u(b.wow)),'   NOT IMPROVED:',ln(d(b.wow)),'');
 L.push('4. SINCE 15 SEP','   IMPROVED:',ln(u(b.vs_base)),'   NOT IMPROVED:',ln(d(b.vs_base)),'');
 L.push('5. BODY FAT BY DATE (target → trend)');
 D.bf_table.forEach(function(r,i){L.push('   '+'abcdefghij'[i]+'. '+dayLab(r.day)+' · '+r.bf+'% · lean '+r.lean.toFixed(2)+' → '+(r.proj_day==null?'not reached':dayLab(r.proj_day))+' · '+r.status)});L.push('');
 L.push('6. CHART INSIGHTS','   a. Body fat: '+D.bf.insight,'   b. Lean: '+D.lean.insight,'   c. Run pace: '+D.run.insight,'   d. Walk pace: '+D.walk.insight,'   e. PM kcal/min: '+D.pm.insight,'');
 if(Ld&&Ld.exercises){L.push('7. LOADS');Ld.exercises.forEach(function(e,i){L.push('   '+'abcdefghijkl'[i]+'. '+e.name+': '+e.current+' since '+dayLab(e.since_day)+' (prev '+(e.previous||'—')+') · gate: '+(e.gate||'—'))});L.push('')}
 var pc=function(c,p){return(p?((c-p)/p*100>=0?'+':'')+((c-p)/p*100).toFixed(0)+'%':'—')};
 L.push('8. ACTIVITY last 7 vs prev 7','   a. steps '+a.last7.steps+' ('+pc(a.last7.steps,a.prev7.steps)+') · km '+fx(a.last7.km,1)+' ('+pc(a.last7.km,a.prev7.km)+')','   b. active kcal '+Math.round(a.last7.active_kcal)+' ('+pc(a.last7.active_kcal,a.prev7.active_kcal)+') · exercise min '+Math.round(a.last7.exercise_min)+' ('+pc(a.last7.exercise_min,a.prev7.exercise_min)+')','');
 var n=9;['run','walk'].forEach(function(k){var w=S.workouts[k];if(!w||!w.latest)return;var x=w.latest,p=w.pace,h=w.avg_hr;
  L.push(n+'. LATEST '+k.toUpperCase()+' '+x.start.slice(0,16)+' · '+fx(x.km,2)+' km · '+fx(x.min,0)+' min','   a. pace '+pf(p.now)+'/km vs last10 '+pf(p.last10)+' · median '+pf(p.median)+' · best '+pf(p.best)+' · since 11 Sep best '+pf(p.best_since),'   b. kcal/min '+fx(w.kcal_min.now,1)+' (median '+fx(w.kcal_min.median,1)+') · avg HR '+fx(h.now,0)+' (median '+fx(h.median,0)+')','');n++});
 L.push(n+'. OPEN ITEMS','   a. see current_state.md; add today\'s question below','');
 return L.join('\n');
}
function copyTxt(){
 if(!LAST)return;var t=buildText(LAST[0],LAST[1],LAST[2]),ok=function(){$('cp').textContent='Copied ✓';setTimeout(function(){$('cp').textContent='Copy for Claude'},1800);$('cpbox').style.display='none'},
 fb=function(){$('cpbox').style.display='block';var ta=$('cpta');ta.value=t;ta.focus();ta.select()};
 try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}
}
$('cp').onclick=copyTxt;
function load(){
 $('err').textContent='';$('gen').textContent='loading…';
 if(!T){$('tok').style.display='block';$('gen').textContent='not connected';return}
 $('tok').style.display='none';
 Promise.all([gh('summary.json'),gh('loads.json').catch(function(){return null}),fetch('plan.json?'+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).catch(function(){return null})]).then(function(r){
  render(JSON.parse(r[0]),r[1]?JSON.parse(r[1]):null,r[2]);
 }).catch(function(e){$('err').textContent='Could not load: '+e.message+(/40[13]/.test(e.message)?' — token missing/expired. Re-paste it below.':'');if(/40[13]/.test(e.message)){$('tok').style.display='block'}$('gen').textContent='error'});
}
$('rf').onclick=load;
$('toksave').onclick=function(){var v=$('tokin').value.trim();if(v){T=v;try{localStorage.setItem(GK,v)}catch(e){}load()}};
load();
